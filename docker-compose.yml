# The Compose project name is PINNED rather than derived from the directory.
#
# Compose defaults the project name to the working directory's name, while the
# `container_name` entries below are fixed literals. Run from a git worktree
# (worktree managers often place them under a separate root) an unpinned
# `docker compose up -d` therefore creates a SEPARATE project with brand new
# empty volumes whose containers claim those same literal names. Postgres comes
# back healthy, on the same port, under the same name, with none of the dev
# data in it, which looks exactly like data loss and is not: the original
# volumes are untouched and still bound to this project name.
#
# Pinning it makes every checkout, worktree and script address one stack.
name: nest-vite-starter

services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    container_name: nest-vite-starter-postgres
    restart: unless-stopped
    ports:
      # Host ports are offset from the defaults (5432, 6379, 1025, 8025) so this
      # stack runs beside other projects' dev stacks. Bound to loopback only.
      - '127.0.0.1:5442:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_vite_starter
    volumes:
      # Postgres 18 images keep the cluster in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts one level up. A
      # volume from a Postgres 17 checkout does not carry over: reset it once
      # with `docker compose down -v`.
      - nest-vite-starter-pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose. The image runs a temporary server during first-time
      # init that listens on the unix socket only, then restarts; a probe over
      # the socket reports ready twice and the second report is a lie. Probing
      # 127.0.0.1 only succeeds once the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d nest_vite_starter']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    # Valkey, a Redis-compatible server. The service keeps the name `redis`
    # because the app's key is REDIS_URL and the client is ioredis.
    image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: nest-vite-starter-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6389:6379'
    volumes:
      - nest-vite-starter-redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: nest-vite-starter-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1035:1025'
      - '127.0.0.1:8035:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nest-vite-starter-pgdata:
  nest-vite-starter-redis-data:

# Repo-wide gitleaks configuration. Single source of truth for the
# secrets CI workflow (.github/workflows/secrets.yml) and the local pre-push
# hook (.husky/pre-push). Both run
# `gitleaks git . --config .gitleaks.toml`.
#
# extend.useDefault keeps the full upstream rule set. The allowlist below is
# narrow and tuned to the actual scan: gitleaks over full history flags
# only synthetic test/sample values (ENCRYPTION_KEY variants and the test
# CSRF_SECRET) that never reach production. Each is exempted by EXACT value, so
# a real secret of the same shape still fails the scan.

[extend]
useDefault = true

[allowlist]
description = "CI-only throwaway keys, env placeholders, lockfile and generated artifacts."
# Match the regexes below against the whole line, so a known value appearing
# anywhere on it is exempt regardless of the assignment syntax.
regexTarget = "line"

paths = [
  # Lockfile: sha512 integrity hashes can trip the generic-api-key entropy
  # heuristic. Never a secret store.
  '''pnpm-lock\.yaml''',
  # TanStack Router generated route tree (committed, regenerated by codegen).
  '''apps/web/src/routeTree\.gen\.ts''',
  # @repo/shared build output (gitignored): tsup chunk names next to
  # `avatarKeyPrefix` trip generic-api-key in a filesystem scan.
  '''packages/shared/dist/.*''',
]

regexes = [
  # CI-only throwaway ENCRYPTION_KEY: a synthetic AES-256 key for the API test
  # boot path. Appears in .github/workflows/ci.yml (x3) and
  # apps/api/test/setup-env.ts. The env validator rejects it in production.
  # Exact value, so any real key still fails.
  '''6e3dd5bc354524fb2d30c764eb2902badcb705c411870216be3234c4b33b1e81''',
  # CI-only synthetic CSRF_SECRET: a >=32-char test stand-in in
  # apps/api/test/setup-env.ts that satisfies the Joi `.min(32)` gate when the
  # AppModule compile spec boots ConfigModule validation. Obviously non-secret
  # (literal "test-csrf-secret..."), never used by the real CSRF flow. Exact
  # value, so a real secret of the same shape still fails the scan.
  '''test-csrf-secret-test-csrf-secret-0123456789''',
  # Synthetic password-hash placeholder in the purge specs. A literal stand-in
  # for an argon2id digest on a fixture row, flagged only because it
  # sits next to `passwordHash`. Not a hash of anything. Exact value, so a real
  # digest still fails.
  '''argon2-existing''',
  # Synthetic secrets fed to the shared logger's value scrubber by its sentinel
  # specs (packages/shared/src/logger/redact.test.ts, redaction-boundary.test.ts
  # and apps/api/src/common/observability/unhandled-rejection.spec.ts). They must
  # look like real Bearer tokens and JWTs, because the specs prove the scrubber
  # removes exactly those shapes; the JWT in redact.test.ts is the public jwt.io
  # sample. None of them authenticates anything. Exact values, so a real key or
  # token of the same shape still fails the scan.
  '''sk_live_sentinelToken''',
  '''sk_live_sentinelBearerValue''',
  '''sk_live_abc123''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJzZW50aW5lbC11c2VyIn0\.c2VudGluZWxzaWduYXR1cmVfdmFsdWU''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
  # Synthetic BullMQ 5 legacy-repeatable keys (md5-shaped hex) in the job
  # scheduler specs: stale-job-schedulers.spec.ts and
  # two-factor-enforcement.scheduler.spec.ts. They stand in for the hash key
  # BullMQ 5 stored a repeatable under, so the specs can prove the stale-scheduler
  # sweep removes it. A Redis key, not a credential. Exact values, so a real
  # secret of the same shape still fails the scan.
  '''f80cc647a5290b107c0e7951ba13af9c''',
]

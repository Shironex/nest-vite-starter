name: secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:17 UTC. Surfaces secrets even when no one pushes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Deliberately NO `concurrency` block. This is the authoritative secret gate, so
# every pushed commit must get its own completed verdict. `cancel-in-progress:
# true` lets a newer push cancel an older run, and a force-push that rewrites
# history leaves the canceled run's commit unscanned while the newer run
# passes on a history that no longer contains it (GitHub still serves the
# orphaned SHA). `cancel-in-progress: false` is not enough either: a group holds
# one running and one pending run, and a new run REPLACES the pending one, so
# the middle of three quick pushes is never scanned. The job takes about a
# minute, so running every push in parallel costs little.

# Least-privilege GITHUB_TOKEN: this workflow only reads the repository.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks CLI pinned by version + sha256 (verified against the official
      # release tarball). Install the same version locally for the pre-push hook.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `gitleaks git` scans every commit, not just HEAD.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "/tmp/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      # The SARIF report is kept as a build artifact rather than uploaded to code
      # scanning, so the workflow needs no `security-events: write` permission
      # and behaves the same on forks. The real gate is `--exit-code 1` below,
      # which fails the job on any finding. GitHub's own secret scanning and
      # push protection run alongside it on the public repository.
      - name: Scan full history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 1

      - name: Upload SARIF report as an artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 7

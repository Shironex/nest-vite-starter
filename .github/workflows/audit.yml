name: audit

# Weekly production dependency audit, so a new advisory surfaces even when no
# one pushes. CI's check job runs the same command (high and above) on every PR.
on:
  schedule:
    # Mondays 06:23 UTC.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Reads the lockfile only: no install needed.
      - run: pnpm audit --prod

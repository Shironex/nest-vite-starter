name: audit

# Weekly production dependency audit, so a new advisory surfaces even when no
# one pushes. CI's check job runs the same command (high and above) on every PR.
on:
  schedule:
    # Mondays 06:23 UTC.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # Reads the lockfile only: no install needed.
      - run: pnpm audit --prod

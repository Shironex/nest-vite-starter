name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Pushes to main each get
# their own run (the group carries the sha there).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA (with a `# vN` comment) and service images by
# digest. Renovate keeps both current.

env:
  # Turbo remote cache: active only when the TURBO_TOKEN secret exists. Without
  # it the value is empty and turbo uses its local cache ("Remote caching disabled").
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # prisma.config.ts needs DATABASE_URL even for `prisma generate`, which turbo
  # runs before build, lint, check-types and test. Jobs with a real database
  # override it.
  DATABASE_URL: postgresql://prisma:prisma@localhost:5432/generate

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      # The verify lanes (tools/verify/lanes.ts), one step each so a red lane is
      # named in the job view. Each lane prints every command it runs; locally
      # `pnpm verify` runs all five in this order.
      - run: pnpm verify --lane=format
      # turbo lint, eslint on tools/, the lint-meta rules and their RULES.md.
      - run: pnpm verify --lane=lint
      - run: pnpm verify --lane=typecheck
      - run: pnpm knip
      # Unit tests in every package plus the tools tests.
      - run: pnpm verify --lane=test
      - run: pnpm verify --lane=build
      - run: pnpm size:check
      - run: pnpm check:contrast

  integration:
    name: API integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # CI-only throwaway key (allowlisted in .gitleaks.toml).
      ENCRYPTION_KEY: 6e3dd5bc354524fb2d30c764eb2902badcb705c411870216be3234c4b33b1e81
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database db:generate
      - run: pnpm --filter @repo/database db:migrate:deploy
      # Fails when the applied history diverges from the migrations folder.
      - run: pnpm --filter @repo/database db:migrate:status
      # Fails when the schema changed without a migration.
      - run: pnpm --filter @repo/database db:migrate:check
      # The *.isolation.spec.ts specs that need a real Postgres and Redis.
      - run: pnpm exec turbo build --filter=@repo/api^...
      - run: pnpm --filter @repo/api test:integration

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mail sink for the api's SMTP transport (same image as docker-compose.yml).
      # The image has no shell for a health check; a step below polls it.
      mailpit:
        image: axllent/mailpit:latest@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # Must match the defaults in apps/web/e2e/support/auth.ts.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: P@ssw0rd!Change.Me
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database db:generate
      - run: pnpm --filter @repo/database db:migrate:deploy
      # The near-empty seed (admin plus the e2e fixture users), not db:seed:dev.
      - run: pnpm --filter @repo/database db:seed
      - run: pnpm exec turbo build --filter=@repo/api --filter=@repo/web

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
      - name: Install Playwright browser and OS deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: Verify cached Playwright browser (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/web exec playwright install chromium

      - name: Wait for mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf 'http://localhost:8025/api/v1/messages?limit=1' > /dev/null && { echo "mailpit up"; exit 0; }
            echo "waiting for mailpit ($i)"; sleep 2
          done
          echo "mailpit never became ready"; exit 1

      # Boots the built entrypoint and waits for /health/ready, which only
      # answers once the database and Redis are wired. This doubles as the boot
      # smoke for the api.
      - name: Start API
        run: |
          node apps/api/dist/src/main.js > /tmp/api.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health/ready > /dev/null && { echo "api ready"; exit 0; }
            kill -0 "$api_pid" 2>/dev/null || { echo "api exited during boot"; break; }
            echo "waiting for api ($i)"; sleep 2
          done
          cat /tmp/api.log; exit 1
        env:
          PORT: '3000'
          NODE_ENV: production
          APP_URL: http://localhost:5173
          SMTP_HOST: localhost
          SMTP_PORT: '1025'
          # Cloudflare's always-pass test secret; CSRF and encryption values are
          # CI-only throwaways (allowlisted in .gitleaks.toml).
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          CSRF_SECRET: ci-e2e-csrf-secret-not-used-by-these-specs-0000
          ENCRYPTION_KEY: 6e3dd5bc354524fb2d30c764eb2902badcb705c411870216be3234c4b33b1e81

      # vite preview serves the built app and proxies the api paths to :3000.
      - name: Start web
        run: |
          pnpm --filter @repo/web exec vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && { echo "web up"; exit 0; }
            echo "waiting for web ($i)"; sleep 2
          done
          cat /tmp/web.log; exit 1

      # The api log only exists on the runner, so print it in this step when a
      # spec fails.
      - name: Playwright
        run: |
          pnpm --filter @repo/web exec playwright test --reporter=list,html || {
            status=$?
            echo "=== api log, last 400 lines ==="
            tail -n 400 /tmp/api.log || true
            exit "$status"
          }

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -f apps/api/Dockerfile -t nest-vite-starter-api:ci .
      - run: docker build -f apps/web/Dockerfile -t nest-vite-starter-web:ci .

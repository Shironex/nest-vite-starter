name: Feature request
description: New behavior or capability
labels: ['enhancement']
body:
  - type: input
    id: summary
    attributes:
      label: One-line summary
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/api
        - apps/web
        - packages/ui
        - packages/database
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
    validations:
      required: true

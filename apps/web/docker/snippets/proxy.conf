proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $forwarded_proto (map in nginx.conf): the scheme the TLS-terminating proxy in
# front reported (http or https, nothing else), else this hop's own $scheme.
# Not plain $scheme: TLS ends in front (Traefik, cloudflared), so this server
# only ever sees http and the api would think every request was plain http.
proxy_set_header X-Forwarded-Proto $forwarded_proto;

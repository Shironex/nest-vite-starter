server {
    # nginx-unprivileged listens on 8080 (rootless containers can't bind <1024).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Written at container start by docker/10-write-config.sh: the CSP source for
    # API_URL and, when API_UPSTREAM is set, the /trpc and /api proxy locations.
    include /tmp/web/runtime.conf;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The runtime config: generated per container, never cached, so a changed
    # environment takes effect on the next load.
    location = /config.js {
        root /tmp/web;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The shell of the SPA must be revalidated, or a deploy keeps serving the old
    # asset names. The SPA fallback below lands here too.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames: cache for a year. No SPA fallback here, so a missing
    # asset is a 404 and never an HTML page served as JavaScript.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# This image serves the SPA only. Deployment uses per-app Dockerfiles with
# external routing (no compose): the platform router in front of this container
# must route /trpc and /api to the api service.
server {
    # nginx-unprivileged listens on 8080 (rootless containers can't bind <1024).
    # The compose port mapping `80:8080` puts it back on 80 externally.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # Security headers. With the theme-boot bootstrapper now external
    # (/theme-boot.js), script-src can drop 'unsafe-inline' entirely.
    # ------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # The Sentry ingest hosts let the SPA ship error events (src/lib/error-reporting.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; font-src 'self' data:; frame-src https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-emit the security headers since add_header in a child location
        # block replaces parent headers.
        add_header X-Content-Type-Options "nosniff" always;
    }
}

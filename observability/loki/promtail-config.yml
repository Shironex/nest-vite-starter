# Promtail configuration: tails Docker container stdout/stderr and ships to Loki.
#
# Promtail discovers running containers via the Docker socket and reads their
# log files from /var/lib/docker/containers on the host.
#
# Labels extracted per container:
#   compose_service : docker-compose service name (e.g. "api", "web")
#   compose_project : docker-compose project name (directory name by default)
#   container_name  : bare container name
#
# Do NOT add userId, requestId, traceId, tenantId, or path as Loki labels ,
# these are high-cardinality fields. Put them in the log line's structured JSON
# and query with LogQL's `| json | ...` pipeline instead.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          # Only ship logs from containers that belong to a compose project.
          # This avoids shipping Promtail's own logs and other unrelated containers.
          - name: label
            values: ['com.docker.compose.project']

    relabel_configs:
      # Use the compose service name as the primary label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      # Keep compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # Bare container name (strip leading /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # Drop the container-id path component from the log path label to avoid cardinality
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: '/var/lib/docker/containers/$1/$1-json.log'

    pipeline_stages:
      # The API's CustomLogger emits JSON in production (NODE_ENV=production).
      # Parse the Docker json-file log wrapper first, then parse the inner JSON
      # payload so its fields become queryable in Grafana without full-text search.
      - json:
          # Docker json-file wraps log lines as: {"log":"...\n","stream":"stdout","time":"..."}
          expressions:
            log_line: log
            stream: stream
      # Parse the inner log_line as JSON (the API's structured log payload).
      # If parsing fails (e.g. web/nginx, plain-text lines), the stage is a no-op.
      - json:
          source: log_line
          expressions:
            level: level
            message: message
            requestId: requestId
            # Do NOT promote userId / tenantId as Loki labels, they are
            # high-cardinality. They remain queryable via LogQL json parsing.
      # Promote `level` as a label (low cardinality: info/warn/error/debug)
      - labels:
          level:
          stream:
      # Set the log line to the inner message when available, otherwise use raw
      - output:
          source: log_line
      # Drop health-check noise from nginx / wget probes
      - drop:
          expression: '.*GET /healthz.*'
          drop_counter_reason: healthcheck_noise
      - drop:
          expression: '.*GET /health.*'
          drop_counter_reason: healthcheck_noise

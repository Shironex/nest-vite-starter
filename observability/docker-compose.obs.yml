# Observability overlay: LGTM stack (Loki + Grafana + Tempo + Mimir/Prometheus)
#
# Usage:
#   docker compose -f docker-compose.prod.yml \
#                  -f observability/docker-compose.obs.yml up -d
#
# All obs containers join the same default network created by docker-compose.prod.yml
# so they can reach the `api`, `postgres`, and `redis` services by name.
#
# Grafana is bound to 127.0.0.1:3001: front it with a reverse proxy in production.
# See docs/observability/README.md for production wiring.
#
# Required env vars (add to your .env or your platform secret store):
#   GRAFANA_ADMIN_PASSWORD : Grafana admin password (no default; startup fails without it)
#   METRICS_USER           : username half of METRICS_BASIC_AUTH
#   METRICS_PASSWORD       : password half of METRICS_BASIC_AUTH
#   POSTGRES_USER          : already required by docker-compose.prod.yml
#   POSTGRES_PASSWORD      : already required by docker-compose.prod.yml
#   POSTGRES_DB            : already required by docker-compose.prod.yml
#   REDIS_PASSWORD         : already required by docker-compose.prod.yml
#
# Optional:
#   LOKI_RETENTION_PERIOD  : default 744h (31d); set e.g. "336h" for 14d
#   TEMPO_RETENTION_HOURS  : default 72 (3d)
#   PROM_RETENTION_DAYS    : default 15d (passed to --storage.tsdb.retention.time)

services:
  # ---------------------------------------------------------------------------
  # Prometheus, metrics store + scraper
  # Pinned: prom/prometheus:v3.3.1 (LTS-ish as of May 2026)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.3.1@sha256:e2b8aa62b64855956e3ec1e18b4f9387fb6203174a4471936f4662f437f04405
    container_name: obs-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROM_RETENTION_DAYS:-15d}'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    # Internal only, do not expose 9090 publicly.
    # Access via Grafana datasource or: docker exec obs-prometheus promtool query ...
    expose:
      - '9090'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Loki, log aggregation (single-binary, filesystem storage)
  # Pinned: grafana/loki:3.5.0 (May 2026)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    container_name: obs-loki
    restart: unless-stopped
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    expose:
      - '3100'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Promtail, log shipper (tails Docker container stdout/stderr → Loki)
  # Pinned: grafana/promtail:3.5.0, must match Loki minor version
  #
  # Requires access to the Docker socket and container log files on the host.
  # In production (Docker on a VM) these paths are the host paths.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.5.0@sha256:507dfecd2f0949475d071c124bea1c26fc4f8c1cff0372eee57478d5b1c5fbff
    container_name: obs-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp/positions
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Tempo, distributed tracing (single-binary, filesystem storage)
  # Pinned: grafana/tempo:2.7.2 (May 2026)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    container_name: obs-tempo
    restart: unless-stopped
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    expose:
      - '3200' # Tempo query frontend (Grafana datasource)
      - '4317' # OTLP gRPC, internal use only (OTel collector → Tempo)
      - '4318' # OTLP HTTP, internal use only
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector (contrib), OTLP on-ramp
  # Slice D will instrument the API to emit OTLP here.
  # For now the collector is wired but the API doesn't push to it yet.
  # Pinned: otel/opentelemetry-collector-contrib:0.125.0 (May 2026)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.125.0
    container_name: obs-otel-collector
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Bind OTLP ports to loopback, only the API on the same Docker network
    # should push traces/metrics/logs to the collector.
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC (Slice D: API → collector)
      - '127.0.0.1:4318:4318' # OTLP HTTP  (Slice D: web → collector)
    expose:
      - '8888' # collector self-metrics (scraped by Prometheus)
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Grafana, visualization (single-binary)
  # Pinned: grafana/grafana:11.6.1 (May 2026)
  # Datasources and dashboards provisioned from ./observability/grafana/provisioning/
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.1@sha256:52c3e20686b860c6dc1f623811565773cf51eefa378817a4896dfc863c3c82c8
    container_name: obs-grafana
    restart: unless-stopped
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      # Serve Grafana at root when behind Traefik proxy
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/'
      # Bind only to loopback, Traefik proxies inbound traffic
      GF_SERVER_HTTP_ADDR: '127.0.0.1'
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # postgres-exporter, exposes Postgres metrics for Prometheus
  # Pinned: prometheuscommunity/postgres-exporter:v0.17.1 (May 2026)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    container_name: obs-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas_starter}?sslmode=disable'
    expose:
      - '9187'
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # redis-exporter, exposes Redis metrics for Prometheus
  # Pinned: oliver006/redis_exporter:v1.67.0 (May 2026)
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
    container_name: obs-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://redis:6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    expose:
      - '9121'
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 32M

  # ---------------------------------------------------------------------------
  # node-exporter, host-level metrics (CPU, memory, disk, network)
  # Pinned: prom/node-exporter:v1.9.1 (May 2026)
  # pid=host + network=host are intentional, node-exporter needs host namespaces
  # to read accurate CPU/network/filesystem stats.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    container_name: obs-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # node-exporter uses host networking, so Prometheus scrapes 127.0.0.1:9100
    # (see prometheus.yml scrape config for the node job)
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  prom_data:
  loki_data:
  tempo_data:
  grafana_data:
  promtail_positions:

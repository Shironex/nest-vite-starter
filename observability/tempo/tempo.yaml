# Tempo single-binary configuration: filesystem storage.
# Appropriate for a single host. Do NOT enable distributed mode here.
# Ref: https://grafana.com/docs/tempo/latest/configuration/

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '0.0.0.0:4317'
        http:
          endpoint: '0.0.0.0:4318'

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: ${TEMPO_RETENTION_HOURS:-72}h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Prometheus-compatible metrics endpoint for Tempo self-metrics
metrics_generator:
  registry:
    external_labels:
      source: tempo
      env: production
  storage:
    path: /var/tempo/generator/wal

# Span-level search index: required for TraceQL queries in Grafana
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09

querier:
  max_concurrent_queries: 20

analytics:
  reporting_enabled: false

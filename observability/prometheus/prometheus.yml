global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Do NOT add high-cardinality external_labels here (e.g. no userId, requestId,
  # path, tenantId). These labels are safe:
  external_labels:
    env: production

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # ---------------------------------------------------------------------------
  # API, NestJS /metrics endpoint (basic-auth protected)
  #
  # METRICS_USER and METRICS_PASSWORD must match the METRICS_BASIC_AUTH value
  # in the API's .env: METRICS_BASIC_AUTH="${METRICS_USER}:${METRICS_PASSWORD}"
  # ---------------------------------------------------------------------------
  - job_name: api
    metrics_path: /metrics
    basic_auth:
      username: '${METRICS_USER}'
      password: '${METRICS_PASSWORD}'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: api

  # ---------------------------------------------------------------------------
  # postgres-exporter, connection pool, slow queries, deadlocks, cache hit ratio
  # ---------------------------------------------------------------------------
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  # ---------------------------------------------------------------------------
  # redis-exporter, ops/sec, hit/miss ratio, memory, evictions
  # ---------------------------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # ---------------------------------------------------------------------------
  # node-exporter, host CPU, memory, disk, network
  # Uses host networking, so the target is the Docker host loopback.
  # ---------------------------------------------------------------------------
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: node

  # ---------------------------------------------------------------------------
  # OTel Collector self-metrics, pipeline throughput, export errors
  # ---------------------------------------------------------------------------
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: otel-collector
